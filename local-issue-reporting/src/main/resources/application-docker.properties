# PostgreSQL - use service name instead of localhost
spring.datasource.url=jdbc:postgresql://postgres:5432/local_issue_db

# Redis - use service name instead of localhost
spring.data.redis.host=redis

# Kafka - use service name instead of localhost
spring.kafka.bootstrap-servers=kafka:9092

# RabbitMQ - use service name instead of localhost
spring.rabbitmq.host=rabbitmq

# AI Service - use service name instead of localhost
ai.service.url=http://ai-service:8000

# Keycloak JWT - fetch JWK Set directly from internal Docker network.
# Using jwk-set-uri instead of issuer-uri avoids startup dependency on Keycloak
# and bypasses issuer mismatch (tokens issued via localhost:8180, fetched via keycloak:8080).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/civic-tracker/protocol/openid-connect/certs
